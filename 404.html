<script>
/* 27 Nov 2026: a mistyped album address (e.g. /a=<id> with the "?" missing, or /<id> on its own) goes to the album. */
(function () {
  var all = decodeURIComponent(location.pathname + location.search + location.hash);
  var m = all.match(/(?:^|[\/?&#])a\s*[=\/]\s*([\w-]{20,})/) || location.pathname.match(/^\/+([\w-]{25,})\/?$/);
  if (m) location.replace('/?a=' + m[1]);
})();
</script>
