<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job photos – Viva Plumbing</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--viva:#13b8e6;--deep:#0a8fbd;--ink:#0f172a;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#eef9fd;}
  .hero{background:#13b8e6 url('https://drive.google.com/thumbnail?id=1BM3LvQo40XnJRk3vpCfA7WtlHHORizHj&sz=w1600') center/cover no-repeat;color:#fff;padding:22px 18px 26px;text-shadow:0 1px 3px rgba(0,40,60,.45);}
  .brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;}
  .brand img{height:54px;width:auto;border-radius:8px;}
  .wordmark{font-weight:300;font-size:30px;line-height:.95;letter-spacing:-.5px}
  .wordmark b{font-weight:300;display:block}
  .job{margin:18px auto 0;max-width:1100px;}
  .job .addr{font-size:22px;font-weight:800;line-height:1.25}
  .job .meta{margin-top:6px;font-size:15px;opacity:.95}
  .pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 10px 30px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .tile{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;background:#cfeaf5;aspect-ratio:1/1;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.15)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:rgba(0,0,0,.25)}
  .msg{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#475569}
  .foot{text-align:center;color:#475569;font-size:14px;padding:18px 10px 30px;line-height:1.6}
  .foot b{color:var(--deep)}
  .lb{position:fixed;inset:0;background:rgba(5,15,25,.94);display:none;align-items:center;justify-content:center;z-index:9}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:86vh;border-radius:6px;touch-action:none;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
  .lb img.zoomed{border-radius:0}
  .lb iframe{width:min(100%,960px);height:70vh;border:0;border-radius:6px;background:#000}
  .lb .x,.lb .nav{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;font-size:22px;width:46px;height:46px;cursor:pointer}
  .lb .x{top:12px;right:12px}.lb .prev{left:10px;top:50%}.lb .next{right:10px;top:50%}
  .lb .cnt{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#cbd5e1;font-size:14px}
  .lb .dl{position:absolute;top:14px;left:14px;color:#fff;font-size:14px;text-decoration:none;background:rgba(255,255,255,.14);padding:9px 14px;border-radius:999px}
  .mail{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(71,85,105,.35);text-underline-offset:3px}
  .ask{display:none;margin:10px auto 0;max-width:320px;text-align:center}
  .ask.on{display:block}
  .ask label{display:block;font-size:13px;color:#64748b;margin-bottom:6px}
  .ask .row{display:flex;gap:6px;border-bottom:1px solid #cbd5e1;padding-bottom:4px}
  .ask input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:6px 2px;outline:none}
  .ask button{border:0;background:none;color:var(--deep);font:inherit;font-weight:700;cursor:pointer;padding:6px 4px}
  .ask .note{font-size:13px;color:#64748b;min-height:18px;margin-top:6px}
  .tile .tick{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:999px;border:2px solid #fff;background:rgba(15,23,42,.35);display:none}
  .editing .tile .tick{display:block}
  .tile.sel{outline:4px solid var(--deep);outline-offset:-4px}
  .tile.sel img{opacity:.5}
  .tile.sel .tick{background:var(--deep)}
  .tile.sel .tick:after{content:"✓";color:#fff;font-size:15px;font-weight:700;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ebar{display:none;position:sticky;bottom:0;background:#fff;border-top:1px solid #cfeaf5;padding:10px 12px;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}
  .editing + .ebar,.ebar.on{display:flex}
  .ebar button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
  .ebar .go{background:var(--viva);color:#fff}.ebar .go:disabled{opacity:.5}
  .ebar .done{background:#e2e8f0;color:var(--ink)}
  .ebar span{font-size:14px;color:#475569;width:100%;text-align:center}
  .ebar .turn{background:#e0f2fe;color:var(--deep)}
  .tile img{transition:transform .2s}
</style>
</head>
<body>
<div class="hero">
  <div class="brand"><img id="logo" alt="Viva Plumbing" style="display:none"><div class="wordmark">viva<b>plumbing</b></div></div>
  <div class="job"><div class="addr" id="addr">Job photos</div><div class="meta" id="meta">Loading…</div><span class="pill" id="count" style="display:none"></span></div>
</div>
<div class="wrap" id="wrap"><div class="msg">Loading the photos…</div></div>
<div class="ebar" id="ebar"><span id="emsg">Tap the photos to select them.</span><button class="turn" id="eTurn" disabled>Turn ↻</button><button class="go" id="eSave" style="display:none">Save turns</button><button class="go" id="eGo" disabled>Remove</button><button class="done" id="eDone">Done</button></div>
<div class="foot">Job photos supplied by <b>Viva Plumbing</b><br><button class="mail" id="mail" type="button">info@vivaplumbing.com</button> · 0475 521 500
  <div class="ask" id="ask"><label for="askIn">Send us an email</label><div class="row"><input id="askIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your email address"><button id="askGo" type="button">Send</button></div><div class="note" id="askNote"></div></div>
</div>
<div class="lb" id="lb">
  <button class="x" id="lbClose" aria-label="Close">✕</button>
  <button class="nav prev" id="lbPrev" aria-label="Previous">‹</button><button class="nav next" id="lbNext" aria-label="Next">›</button>
  <a class="dl" id="dl" target="_blank" rel="noopener">Download</a><div id="stage"></div><div class="cnt" id="cnt"></div>
</div>
<script>
  // The Job Photo Linker web app (vivaorganise). Only albums inside the Job Photos folder are served.
  var API = 'https://script.google.com/macros/s/AKfycbxm1fZOfJeUHPrycO70JJHEW8k5CbDWrP1HtmVIVnogeIVCqc9xYSTvmSVmDoygipAV8g/exec';
  var ITEMS = [], at = 0, sx = null, EDIT = '', SEL = {}, TURN = {};
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function thumb(id, w){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; }
  function notFound(){ $('addr').textContent = 'Album not found'; $('meta').textContent = 'Please check the link, or contact info@vivaplumbing.com'; $('wrap').innerHTML = ''; }
  function render(d){
    document.title = 'Job photos – ' + (d.address || 'Viva Plumbing');
    $('addr').textContent = d.address || 'Job photos';
    $('meta').textContent = [d.date, d.ref].filter(Boolean).join(' · ');
    if (d.logo){ $('logo').src = thumb(d.logo, 200); $('logo').style.display = ''; }
    ITEMS = d.items || [];
    var np = ITEMS.filter(function(i){ return !i.v; }).length, nv = ITEMS.length - np;
    var c = [np ? np + ' photo' + (np > 1 ? 's' : '') : '', nv ? nv + ' video' + (nv > 1 ? 's' : '') : ''].filter(Boolean).join(' · ');
    if (c){ $('count').textContent = c; $('count').style.display = ''; }
    if (!ITEMS.length){ $('wrap').innerHTML = '<div class="msg">Photos for this job are on their way.</div>'; return; }
    $('wrap').innerHTML = '<div class="grid">' + ITEMS.map(function(i, k){
      return '<button class="tile" data-k="' + k + '" aria-label="' + (i.v ? 'Play video ' : 'Open photo ') + (k + 1) + '"><img loading="lazy" src="' + thumb(i.id, 600) + '" alt="">' + (i.v ? '<span class="play">▶</span>' : '') + '</button>';
    }).join('') + '</div>';
    [].forEach.call(document.querySelectorAll('.tile'), function(b){
      b.insertAdjacentHTML('beforeend', '<span class="tick"></span>');
      b.addEventListener('click', function(){ if (EDIT) pick(b); else openAt(+b.getAttribute('data-k')); });
    });
    if (EDIT) $('wrap').firstChild.classList.add('editing');
  }
  function show(){
    var i = ITEMS[at];
    $('stage').innerHTML = i.v ? '<iframe allow="autoplay" allowfullscreen src="https://drive.google.com/file/d/' + esc(i.id) + '/preview"></iframe>' : '<img src="' + thumb(i.id, 2000) + '" alt="">';
    $('cnt').textContent = (at + 1) + ' of ' + ITEMS.length;
    zReset(); if (!i.v) zBind($('stage').querySelector('img'), i.id);
    $('dl').href = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(i.id);
  }
  function openAt(k){ at = k; show(); $('lb').classList.add('on'); }
  function closeLb(){ $('lb').classList.remove('on'); $('stage').innerHTML = ''; }
  function step(d){ at = (at + d + ITEMS.length) % ITEMS.length; show(); }
  $('lbClose').onclick = closeLb; $('lbPrev').onclick = function(){ step(-1); }; $('lbNext').onclick = function(){ step(1); };
  $('lb').addEventListener('click', function(e){ if (e.target === $('lb')) closeLb(); });
  document.addEventListener('keydown', function(e){ if (!$('lb').classList.contains('on')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
  $('lb').addEventListener('touchstart', function(e){ sx = (e.touches.length === 1 && Z.s === 1) ? e.touches[0].clientX : null; }, { passive: true });
  $('lb').addEventListener('touchend', function(e){ if (sx === null || Z.s !== 1 || Z.pinched) { sx = null; return; } var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });

  /* Zoom: pinch, double-tap / double-click, mouse wheel; drag to look around while zoomed. */
  var Z = { s: 1, x: 0, y: 0, img: null, id: '', hi: false, pinched: false };
  function zApply(){ if (!Z.img) return; Z.img.style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')'; Z.img.classList.toggle('zoomed', Z.s > 1); }
  function zReset(){ Z.s = 1; Z.x = 0; Z.y = 0; Z.hi = false; Z.pinched = false; if (Z.img) { Z.img.style.transform = ''; Z.img.classList.remove('zoomed'); } }
  function zClamp(){
    if (!Z.img) return;
    var w = Z.img.offsetWidth, h = Z.img.offsetHeight;
    if (Z.s <= 1) { Z.s = 1; Z.x = 0; Z.y = 0; return; }
    Z.x = Math.min(0, Math.max(w - w * Z.s, Z.x)); Z.y = Math.min(0, Math.max(h - h * Z.s, Z.y));
  }
  function zTo(s, cx, cy){   // cx, cy = point on the photo (px from its top-left, unscaled view) to keep still
    s = Math.max(1, Math.min(6, s));
    Z.x = cx - (cx - Z.x) * (s / Z.s); Z.y = cy - (cy - Z.y) * (s / Z.s); Z.s = s;
    zClamp(); zApply();
    if (Z.s > 1.6 && !Z.hi) { Z.hi = true; var big = new Image(); big.onload = function(){ if (Z.img && Z.img.getAttribute('data-id') === Z.id) Z.img.src = big.src; }; big.src = thumb(Z.id, 4000); }
  }
  function zLocal(e, img){ var r = img.parentNode.getBoundingClientRect(), ir = img.getBoundingClientRect(); return { x: e.clientX - (ir.left - Z.x), y: e.clientY - (ir.top - Z.y) }; }
  function zBind(img, id){
    Z.img = img; Z.id = id; if (!img) return; img.setAttribute('data-id', id);
    var lastTap = 0, drag = null, pinch = null;
    img.addEventListener('dblclick', function(e){ var p = zLocal(e, img); zTo(Z.s > 1 ? 1 : 2.5, p.x, p.y); e.preventDefault(); });
    img.addEventListener('wheel', function(e){ e.preventDefault(); var p = zLocal(e, img); zTo(Z.s * (e.deltaY < 0 ? 1.25 : 0.8), p.x, p.y); }, { passive: false });
    img.addEventListener('mousedown', function(e){ if (Z.s <= 1) return; e.preventDefault(); drag = { x: e.clientX - Z.x, y: e.clientY - Z.y }; });
    window.addEventListener('mousemove', function(e){ if (!drag) return; Z.x = e.clientX - drag.x; Z.y = e.clientY - drag.y; zClamp(); zApply(); });
    window.addEventListener('mouseup', function(){ drag = null; });
    img.addEventListener('click', function(e){ e.stopPropagation(); });
    img.addEventListener('touchstart', function(e){
      if (e.touches.length === 2) {
        Z.pinched = true;
        var t0 = e.touches[0], t1 = e.touches[1];
        pinch = { d: Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY), s: Z.s, mid: zLocal({ clientX: (t0.clientX + t1.clientX) / 2, clientY: (t0.clientY + t1.clientY) / 2 }, img) };
        drag = null;
      } else if (e.touches.length === 1) {
        var now = Date.now(), t = e.touches[0];
        if (now - lastTap < 300) { var p = zLocal(t, img); zTo(Z.s > 1 ? 1 : 2.5, p.x, p.y); lastTap = 0; e.preventDefault(); return; }
        lastTap = now;
        if (Z.s > 1) drag = { x: t.clientX - Z.x, y: t.clientY - Z.y };
      }
    }, { passive: false });
    img.addEventListener('touchmove', function(e){
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        var t0 = e.touches[0], t1 = e.touches[1], d = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
        zTo(pinch.s * d / pinch.d, pinch.mid.x, pinch.mid.y);
      } else if (drag && e.touches.length === 1 && Z.s > 1) {
        e.preventDefault(); Z.x = e.touches[0].clientX - drag.x; Z.y = e.touches[0].clientY - drag.y; zClamp(); zApply();
      }
    }, { passive: false });
    img.addEventListener('touchend', function(e){ if (e.touches.length < 2) pinch = null; if (!e.touches.length) { drag = null; setTimeout(function(){ Z.pinched = false; }, 50); } });
  }

  var a = new URLSearchParams(location.search).get('a') || '';
  function load(){
    return fetch(API + '?json=1&a=' + encodeURIComponent(a), { credentials: 'omit' })   // no Google login sent: avoids the multi-account bug
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok) render(d); else notFound(); })
      .catch(function(){ $('meta').textContent = 'Could not load the photos - please refresh the page.'; $('wrap').innerHTML = ''; });
  }
  if (!/^[\w-]{20,}$/.test(a)) notFound(); else load();

  // The email address opens a small "Send us an email" box. An email address (or nothing) opens the mail app as usual.
  function post(body){
    return fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  $('mail').onclick = function(){ $('ask').classList.toggle('on'); if ($('ask').classList.contains('on')) $('askIn').focus(); };
  function send(){
    var v = $('askIn').value.trim();
    if (!v || v.indexOf('@') !== -1 || !a){ location.href = 'mailto:info@vivaplumbing.com'; return; }
    $('askGo').disabled = true; $('askNote').textContent = 'Sending…';
    post({ act: 'check', a: a, code: v }).then(function(r){
      $('askGo').disabled = false;
      if (r && r.ok){ EDIT = v; $('askIn').value = ''; $('askNote').textContent = ''; $('ask').classList.remove('on'); startEdit(); }
      else $('askNote').textContent = 'Please check the email address.';
    }).catch(function(){ $('askGo').disabled = false; $('askNote').textContent = 'Could not send - please try again.'; });
  }
  $('askGo').onclick = send;
  $('askIn').addEventListener('keyup', function(e){ if (e.key === 'Enter') send(); });

  function selCount(){ return Object.keys(SEL).length; }
  function startEdit(){ SEL = {}; var g = document.querySelector('#wrap .grid'); if (g) g.classList.add('editing'); $('ebar').classList.add('on'); updBar(); window.scrollTo(0, 0); }
  function stopEdit(){ EDIT = ''; SEL = {}; TURN = {}; showTurns(); var g = document.querySelector('#wrap .grid'); if (g) g.classList.remove('editing'); [].forEach.call(document.querySelectorAll('.tile.sel'), function(t){ t.classList.remove('sel'); }); $('ebar').classList.remove('on'); }
  function pick(b){ var id = ITEMS[+b.getAttribute('data-k')].id; if (SEL[id]){ delete SEL[id]; b.classList.remove('sel'); } else { SEL[id] = 1; b.classList.add('sel'); } updBar(); }
  function updBar(){
    var n = selCount(), t = Object.keys(TURN).filter(function(k){ return TURN[k] % 4; }).length;
    var vids = Object.keys(SEL).some(function(id){ return (ITEMS.filter(function(i){ return i.id === id; })[0] || {}).v; });
    $('eGo').disabled = !n; $('eGo').textContent = n ? 'Remove ' + n : 'Remove';
    $('eTurn').disabled = !n || vids;
    $('eSave').style.display = t ? '' : 'none'; $('eSave').textContent = 'Save ' + t + ' turned';
    $('emsg').textContent = t ? 'Turn until they look right, then Save.' : vids ? 'Videos can\'t be turned - select photos only.' : n ? n + ' selected.' : 'Tap the photos to select them.';
  }
  function showTurns(){
    [].forEach.call(document.querySelectorAll('.tile'), function(b){ var it = ITEMS[+b.getAttribute('data-k')], r = (TURN[it.id] || 0) % 4, img = b.querySelector('img'); if (img) img.style.transform = r ? 'rotate(' + (r * 90) + 'deg)' : ''; });
  }
  $('eTurn').onclick = function(){ Object.keys(SEL).forEach(function(id){ TURN[id] = ((TURN[id] || 0) + 1) % 4; }); showTurns(); updBar(); };
  // Turn the real picture: fetch it from the album, turn it here, send it back (the old one goes to the Bin).
  function turnOne(id, q){
    return post({ act: 'img', a: a, code: EDIT, id: id }).then(function(r){
      if (!r || !r.ok) throw new Error((r && r.msg) || 'Could not open the photo.');
      return new Promise(function(res, rej){
        var im = new Image();
        im.onload = function(){
          var c = document.createElement('canvas'), w = im.naturalWidth, h = im.naturalHeight, side = q % 2;
          c.width = side ? h : w; c.height = side ? w : h;
          var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(q * Math.PI / 2); x.drawImage(im, -w / 2, -h / 2);
          res(c.toDataURL('image/jpeg', 0.92));
        };
        im.onerror = function(){ rej(new Error('Could not read the photo.')); };
        im.src = 'data:' + (r.mime || 'image/jpeg') + ';base64,' + r.b64;
      });
    }).then(function(url){ return post({ act: 'rotate', a: a, code: EDIT, id: id, b64: url.split(',')[1] }); })
      .then(function(r){ if (!r || !r.ok) throw new Error((r && r.msg) || 'Could not save it.'); });
  }
  $('eSave').onclick = function(){
    var ids = Object.keys(TURN).filter(function(k){ return TURN[k] % 4; }); if (!ids.length) return;
    $('eSave').disabled = true; var done = 0, fail = '';
    var next = function(){
      if (!ids.length){
        TURN = {}; SEL = {}; $('eSave').disabled = false;
        load().then(function(){ var g = document.querySelector('#wrap .grid'); if (g && EDIT) g.classList.add('editing'); updBar(); $('emsg').textContent = done + ' turned' + (fail ? ' - ' + fail : '') + '.'; });
        return;
      }
      var id = ids.shift(); $('emsg').textContent = 'Turning ' + (done + 1) + '…';
      turnOne(id, TURN[id] % 4).then(function(){ done++; next(); }).catch(function(e){ fail = e.message; next(); });
    };
    next();
  };
  $('eDone').onclick = stopEdit;
  $('eGo').onclick = function(){
    var ids = Object.keys(SEL); if (!ids.length) return;
    if ($('eGo').getAttribute('data-arm') !== '1'){ $('eGo').setAttribute('data-arm', '1'); $('eGo').textContent = 'Tap again to remove ' + ids.length; setTimeout(function(){ $('eGo').removeAttribute('data-arm'); updBar(); }, 4000); return; }
    $('eGo').removeAttribute('data-arm'); $('eGo').disabled = true; $('emsg').textContent = 'Removing…';
    post({ act: 'remove', a: a, code: EDIT, ids: ids }).then(function(r){
      $('emsg').textContent = (r && r.msg) || 'Done.';
      if (r && r.ok){ SEL = {}; load().then(function(){ var g = document.querySelector('#wrap .grid'); if (g && EDIT) g.classList.add('editing'); updBar(); $('emsg').textContent = r.msg; }); }
      else { $('eGo').disabled = false; if (/passcode|turned off/i.test((r && r.msg) || '')) stopEdit(); }
    }).catch(function(){ $('eGo').disabled = false; $('emsg').textContent = 'Could not remove - please try again.'; });
  };
</script>
</body>
</html>
